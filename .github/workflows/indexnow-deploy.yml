# 일반 배포 때 바뀐 페이지를 네이버·Bing 에 자동 색인 요청 (2026-11-02)
# 자동 발행 글은 weekly-content.yml 이 이미 제출한다. 실패해도 배포에는 영향이 없다.
name: IndexNow on deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'docs/**'
      - 'functions/**'
      - '**.md'

permissions:
  contents: read

jobs:
  submit:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Cloudflare Pages 빌드가 끝나기 전에 알리면 크롤러가 옛 화면을 다시 읽는다.
      # 기존 URL 은 배포 전에도 200 이라 응답으로 구분할 수 없어 빌드 시간(약 2분)보다 넉넉히 기다린다.
      - name: 배포 대기
        run: sleep 300
      - name: 색인 요청
        run: node scripts/indexnow-deploy.mjs "${{ github.event.before }}" "${{ github.sha }}"
