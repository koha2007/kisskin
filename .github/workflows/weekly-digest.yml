name: Weekly digest email

# 매주 일요일 09:00 KST — 지난 7일간 자동 발행된 메이크업 제품과 뉴스를 요약해
# 회원(Supabase auth.users) 전원에게 메일 1통을 보낸다.
#
# 2026-09-19: 발행이 주 1회(화 06:00 KST, 뉴스 1 + 제품 1)로 내려가 제품만으론
# 메일이 1건짜리가 된다 → 같은 주 뉴스 1건을 함께 싣는다. 화요일 발행분은
# 일요일 기준 7일 창에 들어온다.
#
# 파이프라인:
#   build-digest-payload.mjs  지난 7일 제품·뉴스를 items.ts(.en.ts)에서 뽑아 JSON
#     → POST https://kissinskin.net/api/announce-products  (functions/api/announce-products.ts)
#       → Supabase 회원 조회 → 운영자/테스트/수신거부 제외 → Resend 로 발송
#
# 필요 시크릿 (Settings → Secrets and variables → Actions):
#   ANNOUNCE_TOKEN  — /api/announce-products 호출용. Cloudflare Pages 환경변수의
#                     같은 이름 값과 반드시 일치해야 한다.
#
# 2026-10-04: 섹션 3개 — 신제품 · 뉴스 · 메이크업 방법(/looks/ 9룩을 1번부터 매주 하나씩).
# 발송 전 항상 "수신자 점검"(dry-run)을 먼저 돌려 언어별·종류별 명단을 로그에 남긴다(운영자 요청).
# 리포가 PUBLIC 이라 Actions 로그는 누구나 본다 → 주소는 서버가 마스킹해서 돌려준다.
#
# 수동: Actions 탭 → 이 워크플로 → Run workflow → dry_run=1 로 먼저 수신자 확인.
# 프리뷰: 함수는 프로덕션에 배포돼 있어야 한다(커밋 후 Cloudflare Pages 빌드 완료 뒤).

on:
  schedule:
    - cron: '0 0 * * 0'   # 일요일 00:00 UTC = 09:00 KST (정기)
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 = 발송 없이 수신자 수만 확인'
        required: false
        default: ''
      operator_only:
        description: '1 = 운영자 사본(koha3d77@gmail.com)만 발송 — 회원에겐 안 나감'
        required: false
        default: ''

concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24  # build-digest-payload.mjs 가 howto.ts 를 바로 import(타입 제거)

      - name: 지난 7일 제품·뉴스로 본문 만들기
        id: payload
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          OPERATOR_ONLY: ${{ github.event.inputs.operator_only }}
        run: |
          # 인자: 제품 최대 8건, 뉴스 최대 3건. 주 1회 발행이라 실제론 각 1건이지만,
          # 수동으로 여러 편을 돌린 주에도 메일이 통째로 길어지지 않게 뉴스는 낮게 잡는다.
          node scripts/build-digest-payload.mjs 8 3 > /tmp/digest.json
          if [ "$OPERATOR_ONLY" = "1" ]; then
            node -e "const f='/tmp/digest.json',fs=require('fs'),d=JSON.parse(fs.readFileSync(f));d.onlyOperator=true;fs.writeFileSync(f,JSON.stringify(d))"
            echo "::notice::운영자 사본만 발송"
          fi
          COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/digest.json'));process.stdout.write(String(d.products.length+d.news.length))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/digest.json'));console.log(\`지난 7일 — 제품 \${d.products.length}건, 뉴스 \${d.news.length}건 · 이번 주 메이크업 방법: \${d.looks[0].number}번 \${d.looks[0].name}\`)"

      - name: 이번 주 새 콘텐츠가 없으면 생략
        if: steps.payload.outputs.count == '0'
        run: echo "::notice::지난 7일간 제품·뉴스 0건 — 다이제스트 발송 생략"

      # 발송 전 점검 — 실제 발송과 같은 명단 로직을 dry-run 으로 돌려 언어·종류·판정 근거를 남긴다.
      # 명단을 못 가져오거나(Supabase 오류) 수신자가 0명이면 여기서 멈춘다.
      - name: 발송 전 수신자 점검 (dry-run)
        if: steps.payload.outputs.count != '0'
        env:
          ANNOUNCE_TOKEN: ${{ secrets.ANNOUNCE_TOKEN }}
        run: |
          node -e "const f='/tmp/digest.json',fs=require('fs'),d=JSON.parse(fs.readFileSync(f));d.dryRun=true;fs.writeFileSync('/tmp/digest-dry.json',JSON.stringify(d))"
          RESP=$(curl -sS -w $'\n%{http_code}' -X POST https://kissinskin.net/api/announce-products \
            -H "Authorization: Bearer $ANNOUNCE_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/digest-dry.json)
          CODE=$(printf '%s' "$RESP" | tail -n1)
          printf '%s' "$RESP" | sed '$d' > /tmp/check.json
          if [ "$CODE" != "200" ]; then
            cat /tmp/check.json; echo "::error::수신자 점검 실패 (HTTP $CODE) — 발송하지 않음"; exit 1
          fi
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/check.json'));
            console.log('수신자', d.recipients, '· 언어', JSON.stringify(d.byLang), '· 종류', JSON.stringify(d.byKind));
            console.log('제목(ko):', d.subject);
            console.log('메이크업 방법:', d.looksKo, d.looksEn);
            console.log('--- 명단 (lang kind why email) — why: saved=본인 설정, form=구독폼 언어, 그 외=추정');
            for (const r of d.list||[]) console.log(r.lang, r.kind.padEnd(10), r.why.padEnd(12), r.email);
            console.log('::notice::수신자 '+d.recipients+'명 (ko '+d.byLang.ko+' · en '+d.byLang.en+') · 구독자 '+d.byKind.subscriber+' · 추정 언어 '+d.guessed);
            if (!d.recipients) { console.log('::error::수신자 0명 — 발송 중단'); process.exit(1) }
          "

      - name: 다이제스트 발송 (/api/announce-products)
        if: steps.payload.outputs.count != '0' && github.event.inputs.dry_run != '1'
        env:
          ANNOUNCE_TOKEN: ${{ secrets.ANNOUNCE_TOKEN }}
        run: |
          if [ -z "$ANNOUNCE_TOKEN" ]; then
            echo "::error::ANNOUNCE_TOKEN 시크릿이 없습니다."
            exit 1
          fi
          RESP=$(curl -sS -w $'\n%{http_code}' -X POST https://kissinskin.net/api/announce-products \
            -H "Authorization: Bearer $ANNOUNCE_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/digest.json)
          CODE=$(printf '%s' "$RESP" | tail -n1)
          BODY=$(printf '%s' "$RESP" | sed '$d')
          echo "HTTP $CODE"
          echo "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "::error::다이제스트 발송 실패 (HTTP $CODE)"
            exit 1
          fi
          # HTTP 200 은 "요청이 처리됐다"일 뿐 전원 도달을 뜻하지 않는다.
          # 2026-09-14·09-20 발송은 200 이면서 수신자 절반이 429 로 실패했고,
          # 워크플로가 초록이라 한 주 동안 아무도 몰랐다. 한 명이라도 실패하면 빨갛게 띄운다.
          FAILED=$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).failed??0))}catch{process.stdout.write('0')}})")
          if [ "$FAILED" != "0" ]; then
            echo "::error::수신자 $FAILED 명에게 전달 실패 — 위 errors 확인"
            exit 1
          fi
