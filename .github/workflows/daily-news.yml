name: Daily K-beauty content

# 매일 06:00 KST:
#   · 뉴스 1편 (Gemini + Google Search 그라운딩) + EN 자동번역
#   · 메이크업 제품 1건 (검색 그라운딩 + 무드컷 이미지) + EN 자동번역
# push → Cloudflare Pages 가 자동 빌드/배포(빌드 중 gen:sitemap 이 사이트맵 자동 갱신).
#
# 필요: 저장소 Settings → Secrets and variables → Actions → New repository secret
#        이름 GEMINI_API_KEY 로 Gemini API 키 등록.
#
# 수동 실행: Actions 탭 → Daily K-beauty content → Run workflow (news count 입력 가능).

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 21:00 UTC = 06:00 KST
  workflow_dispatch:
    inputs:
      count:
        description: '생성할 뉴스 편수'
        required: false
        default: '1'

concurrency:
  group: daily-content
  cancel-in-progress: false

permissions:
  contents: write            # 생성 결과를 main 에 푸시

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30    # 생성(≈5~10분) + IndexNow 의 배포 대기(최대 10분)
    steps:
      # fetch-depth: 0 (전체 히스토리) 가 필요하다. 기본값은 얕은 클론(depth 1)인데,
      # 이 잡은 매일 `npm run gen:sitemap` 을 돌려 sitemap.xml 을 커밋한다. 그 스크립트의
      # lastmod 는 `git log -1 --format=%cs -- <소스파일>` 로 정한다(scripts/gen-sitemap.mjs
      # 의 gitDate). 얕은 클론에는 커밋이 하나뿐이라 이 조회가 늘 빈 값을 내고,
      # 결과적으로 정적·도구 페이지 lastmod 는 실제 수정일을 못 따라가고 허브는
      # `new Date()` 폴백으로 **매일 그날 날짜**가 찍힌다 = 구글에게 매일 거짓말.
      # lastmod 를 반복해서 못 믿게 만들면 재크롤 신호 자체가 무시된다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 뉴스·제품은 서로 독립이다. 예전엔 뉴스가 죽으면 잡이 거기서 끊겨 제품까지
      # 못 나갔다(2026-08-09 Gemini 403 때 그날치 발행이 통째로 0건). 둘 다 끝까지
      # 시도하게 두고, 마지막 "발행 결과 판정" 스텝에서 성패를 가린다.
      - name: Generate news article(s) + EN
        id: news
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/gen-news.mjs "${{ github.event.inputs.count || '1' }}"

      - name: Generate makeup product + EN
        id: product
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 무드컷 OFF (2026-08-09~). 이유: 결제 홀딩 중이라 무료 티어 키로 도는데
          # 이미지 생성은 무료 티어가 없다. 글 발행은 그대로 되고 카드만 디자인
          # 폴백으로 나간다(gen-products.mjs 의 genImage try/catch).
          #
          # ▶️ 되살리기: 결제 복구 후 이 줄을 지우면 끝이다.
          #    (모델은 이미 gemini-3.1-flash-image 로 옮겨 놨다 — imagen-4.0-* 는
          #     2026-08-17 종료. 다만 실키 검증은 못 했으니 GEMINI_HOLD.md 참고.)
          PRODUCT_IMAGES: '0'
        run: node scripts/gen-products.mjs

      - name: Regenerate sitemap
        run: npm run gen:sitemap

      - name: Commit & push if changed
        id: push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/news/items.ts src/lib/news/items.en.ts src/lib/news/enSlugs.ts \
                  src/lib/products/items.ts src/lib/products/items.en.ts src/lib/products/enSlugs.ts \
                  public/products public/sitemap.xml
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            # skip 토큰 금지: Cloudflare Pages 가 '[skip ci]'류를 인식해 배포를 건너뛴다.
            # GITHUB_TOKEN 푸시는 다른 워크플로를 재트리거하지 않으므로 루프 위험도 없음.
            git commit -m "chore(content): 일일 뉴스·메이크업 제품 자동 발행 (KO+EN)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # 새 글을 네이버·Bing 에 즉시 알린다(크롤링 주기를 기다리지 않음).
      # 구글은 IndexNow 미지원 → Search Console 에서 사람이 요청해야 한다.
      # 새 URL 은 사이트맵 diff 로 뽑는다(KO/EN 구분 없이 정확). 허브(목록) 페이지는
      # URL 이 그대로여도 내용이 갱신되므로 함께 알린다.
      - name: IndexNow 색인 요청 (네이버 + Bing)
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true    # 색인 요청 실패가 콘텐츠 발행을 망치지 않게
        run: |
          NEW=$(git show HEAD -- public/sitemap.xml \
                | grep '^+.*<loc>' \
                | sed -E 's/.*<loc>([^<]+)<\/loc>.*/\1/' \
                | sort -u)
          HUBS="https://kissinskin.net/news/ https://kissinskin.net/products/ https://kissinskin.net/en/news/ https://kissinskin.net/en/products/"
          echo "새 URL:"; echo "$NEW" | sed 's/^/  /'
          # --wait: Cloudflare Pages 배포가 끝나 새 글이 실제로 200 을 줄 때까지 기다린다
          # (배포 전에 알리면 크롤러가 404 를 만나 "없는 페이지"로 학습된다).
          node scripts/indexnow.mjs --wait $NEW $HUBS

      # 맨 뒤에 둔다: 발행·색인을 막지 않으면서 잡의 최종 색만 정한다.
      # 한쪽만 죽으면 경고(초록) — 나머지는 이미 발행됐다.
      # 둘 다 죽으면 실패(빨강) — 그래야 운영자에게 Actions 실패 메일이 간다.
      - name: 발행 결과 판정
        run: |
          echo "news=${{ steps.news.outcome }}  product=${{ steps.product.outcome }}"
          if [ "${{ steps.news.outcome }}" != "success" ] && [ "${{ steps.product.outcome }}" != "success" ]; then
            echo "::error::뉴스·제품 둘 다 생성 실패 — 그날치 발행 0건. GEMINI_API_KEY 상태부터 확인할 것(403=결제/키, 429=무료 티어 쿼터). 절차는 리포 루트 GEMINI_HOLD.md"
            exit 1
          fi
          [ "${{ steps.news.outcome }}" = "success" ]    || echo "::warning::뉴스 생성 실패 — 제품만 발행됨"
          [ "${{ steps.product.outcome }}" = "success" ] || echo "::warning::제품 생성 실패 — 뉴스만 발행됨"
