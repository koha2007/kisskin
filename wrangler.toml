name = "kisskin"
pages_build_output_dir = "dist/client"
compatibility_date = "2026-02-18"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[vars]
# GEMINI_API_KEY는 Cloudflare 대시보드 Environment variables에서 시크릿으로 관리
# 🔒 반드시 **유료 티어 키**만 넣을 것. 이 경로(functions/api/analyze.ts)는 사용자 셀카를
#    Gemini 로 보낸다. 무료 티어는 약관상 구글이 입력을 제품 개선에 쓰고 사람이 읽을 수
#    있다 → 고객 얼굴이 학습·사람검토로 들어가고, 개인정보처리방침에 "유료 등급으로만
#    이용" 이라 고지한 것과도 어긋난다. 유료 키가 없으면 변수를 **비워 둘 것**
#    (analyze.ts 가 자동으로 OpenAI 로 넘어간다). GitHub Actions 쪽은 무료 키 OK —
#    거기는 사용자 데이터가 없다. 배경은 리포 루트 GEMINI_HOLD.md

# ── 메이크업 사용량/크레딧 가드용 KV (프로덕션) ──────────────────────────
# makeup-edit Worker가 (fingerprint+IP)당 무료 횟수를 기록하는 저장소.
# dev 는 vite.config.ts 의 파일백드 셔임을 쓰므로 이 바인딩과 무관(프로덕션 전용).
# 네임스페이스는 `npx wrangler kv namespace create MAKEUP_USAGE` 로 생성됨.
[[kv_namespaces]]
binding = "MAKEUP_USAGE"
id = "1588216109cc4401b0bfd7356e2a6d46"

# ── 앱 푸시 알림 토큰 저장소 ──────────────────────────────────────────
# Expo 앱이 발급한 푸시 토큰을 (register-push-token 함수가) 여기에 저장.
# 발송기가 이 KV 를 순회하며 Expo Push API 로 알림 발송.
# 네임스페이스는 Cloudflare 대시보드에서 생성됨 (2026-07-16).
[[kv_namespaces]]
binding = "PUSH_TOKENS"
id = "f1e845e643b3461e959ad8a3ef827659"
